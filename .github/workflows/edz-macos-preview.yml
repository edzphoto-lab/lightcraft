name: EdZ macOS Intel preview

# Personal fork build, separate from the suite's official shared release pipeline.
on:
  push:
    branches: [build/macos-intel-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edz-macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'edzphoto-lab/lightcraft'
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.95.0'
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: edz-macos-intel
      - name: Install icon renderer
        run: brew install resvg
      - name: Verify Core Image with a Nikon D600 RAW
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/d600.nef"
          # Raw.Pixls.US #916, released under CC0.
          curl -fSL --retry 2 --max-time 90 'https://raw.pixls.us/getfile.php/916/nice/Nikon%20-%20D600%20-%2014bit%2014bit%20compressed%20%28Lossless%29%20%283%3A2%29.NEF' -o "$fixture"
          printf '%s  %s\n' a70c3e54501efa7e4391ec4cf5705912a10c356a029e984ee13be5f68bc7482d "$fixture" | shasum -a 256 -c -
          LIGHTCRAFT_APPLE_RAW_FIXTURE="$fixture" cargo test --locked -p lightcraft-apple-raw --target x86_64-apple-darwin --release -- decodes_camera_raw --ignored
      - name: Build versioned EdZ Lab DMG
        env:
          LIGHTCRAFT_EDZ_LAB: '1'
          LIGHTCRAFT_VERSION: '0.17.12'
        run: bash packaging/macos/package.sh --arch x86_64
      - name: Verify built-in RAW engines on macOS
        run: |
          set -euo pipefail
          cli=target/x86_64-apple-darwin/release/lightcraft-cli
          test_dir="$(mktemp -d)"
          fixture="$RUNNER_TEMP/d600.nef"
          LIGHTCRAFT_RAW_ENGINE=apple LIGHTCRAFT_LOG=debug "$cli" render "$fixture" -o "$test_dir/apple.tif" --size 768 --opt bitDepth=16 2>&1 | tee "$test_dir/apple.log"
          grep -F 'Developed RAW with Apple Core Image' "$test_dir/apple.log"
          LIGHTCRAFT_RAW_ENGINE=lightcraft "$cli" render "$fixture" -o "$test_dir/lightcraft.tif" --size 768 --opt bitDepth=16
          test -s "$test_dir/apple.tif"
          test -s "$test_dir/lightcraft.tif"
      - name: Verify external RAW engines on macOS
        run: |
          set -euo pipefail
          cli="$PWD/target/x86_64-apple-darwin/release/lightcraft-cli"
          fixture="$RUNNER_TEMP/d600.nef"
          test_dir="$(mktemp -d)"
          cd "$test_dir"
          curl -fSL --retry 2 --max-time 120 'https://www.libraw.org/data/LibRaw-0.22.3-macOS.zip' -o libraw.zip
          printf '%s  %s\n' 1edd33c66be1cfdc74e0a471c4143d25f0172234a46a44dce5511a396a35af55 libraw.zip | shasum -a 256 -c -
          unzip -q libraw.zip '*/bin/dcraw_emu'
          LIGHTCRAFT_RAW_ENGINE=libraw LIGHTCRAFT_RAW_ENGINE_PATH="$test_dir/LibRaw-0.22.3/bin/dcraw_emu" LIGHTCRAFT_LOG=debug \
            "$cli" render "$fixture" -o "$test_dir/libraw.tif" --size 768 --opt bitDepth=16 2>&1 | tee libraw.log
          grep -F 'Developed RAW with LibRaw' libraw.log
          test -s libraw.tif
          # 5.12 supports the Intel macOS 15 runner. The CLI loads libraries from the installed app.
          curl -fSL --retry 2 --max-time 180 'https://github.com/RawTherapee/RawTherapee/releases/download/5.12/RawTherapee_macOS_15.4_Universal_5.12.zip' -o rawtherapee.zip
          printf '%s  %s\n' 2f284d1c023f53f0c492aecc3f7635d6b7807ef22d5413ee55715d81e81fe688 rawtherapee.zip | shasum -a 256 -c -
          unzip -q rawtherapee.zip
          rt="$test_dir/RawTherapee_macOS_15.4_Universal_5.12_folder"
          mount="$test_dir/rawtherapee-volume"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$rt/RawTherapee_macOS_15.4_Universal_5.12.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/RawTherapee.app" /Applications/RawTherapee.app
          LIGHTCRAFT_RAW_ENGINE=rawtherapee LIGHTCRAFT_RAW_ENGINE_PATH="$rt/rawtherapee-cli" LIGHTCRAFT_LOG=debug \
            "$cli" render "$fixture" -o "$test_dir/rawtherapee.tif" --size 768 --opt bitDepth=16 2>&1 | tee rawtherapee.log
          grep -F 'Developed RAW with RawTherapee' rawtherapee.log
          test -s rawtherapee.tif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LightCraft-EdZ-Lab-macOS-Intel
          path: |
            dist/release/lightcraft-edz-lab-*-macos-x86_64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
