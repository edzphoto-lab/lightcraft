name: EdZ macOS Intel preview

# Personal fork build, separate from the suite's official shared release pipeline.
on:
  push:
    branches: [build/macos-intel-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edz-macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'edzphoto-lab/lightcraft'
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.95.0'
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: edz-macos-intel
      - name: Install icon renderer
        run: brew install resvg
      - name: Build versioned EdZ Lab DMG
        env:
          LIGHTCRAFT_EDZ_LAB: '1'
          LIGHTCRAFT_VERSION: '0.17.1'
        run: bash packaging/macos/package.sh --arch x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LightCraft-EdZ-Lab-macOS-Intel
          path: |
            dist/release/lightcraft-edz-lab-*-macos-x86_64.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
